<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Liquid Transform Navigation — Compare</title>
<style>
@font-face{font-family:Geist;src:url('../src/assets/fonts/geist-regular.woff2') format('woff2')}
*{box-sizing:border-box}body{margin:0;padding:32px;background:#fafafa;color:#1b1b1b;font:15px/1.5 Geist,Arial,sans-serif}main{max-width:1700px;margin:auto}header{display:flex;align-items:center;justify-content:space-between;gap:20px;margin-bottom:28px}h1{font-size:20px;font-weight:400;margin:0}p{margin:5px 0 0;color:#777;font-size:13px}.actions{display:flex;gap:8px}button{font:inherit;color:inherit;background:white;border:1px solid #ccc;border-radius:999px;padding:8px 18px;cursor:pointer}button:focus-visible{outline:2px solid #555;outline-offset:3px}.comparison{display:grid;grid-template-columns:1fr 1fr;gap:24px}figure{margin:0;min-width:0}figcaption{display:flex;justify-content:space-between;gap:10px;margin-bottom:12px}figcaption span{color:#777;font-size:13px}video{display:block;width:100%;aspect-ratio:593/473;background:#ebebeb;border:1px solid #ddd}#status{min-height:20px;margin-top:18px}@media(max-width:700px){body{padding:20px}header{align-items:flex-start;flex-direction:column}.comparison{gap:12px}figcaption{flex-direction:column;gap:0;font-size:14px}}
header, #status { display: none; }
</style>
</head>
<body>
<main>
<header><div><h1>Liquid Transform Navigation</h1><p>Both start together. Normal holds its last frame until the slow version finishes, then both repeat.</p></div><div class="actions"><button id="toggle" type="button" disabled>Pause</button><button id="restart" type="button" disabled>Restart both</button></div></header>
<div class="comparison">
<figure><figcaption>Normal</figcaption><video muted playsinline preload="auto" aria-label="Normal speed navigation" src="liquid-transform-navigation-loop-2372x1892-60fps.mp4"></video></figure>
<figure><figcaption>Slow mo</figcaption><video muted playsinline preload="auto" aria-label="Three times slower navigation transforms" src="liquid-transform-navigation-slow-transform-loop-2372x1892-60fps.mp4"></video></figure>
</div>
<p id="status" role="status">Loading both videos…</p>
</main>
<script>
const videos=[...document.querySelectorAll('video')],toggle=document.querySelector('#toggle'),restart=document.querySelector('#restart'),status=document.querySelector('#status');
let playing=false,busy=false;
async function play(){try{await Promise.all(videos.filter(v=>!v.ended).map(v=>v.play()));playing=true;toggle.textContent='Pause';status.textContent='';}catch{videos.forEach(v=>v.pause());playing=false;toggle.textContent='Play both';status.textContent='Press Play both to begin.';}}
async function reset(){if(busy)return;busy=true;videos.forEach(v=>v.pause());await Promise.all(videos.map(v=>new Promise(resolve=>{if(v.currentTime===0)return resolve();v.addEventListener('seeked',resolve,{once:true});v.currentTime=0;})));busy=false;await play();}
toggle.onclick=()=>{if(playing){videos.forEach(v=>v.pause());playing=false;toggle.textContent='Play both';}else{void play();}};
restart.onclick=()=>void reset();
videos.forEach(v=>v.addEventListener('ended',()=>{if(videos.every(x=>x.ended)&&playing)void reset();}));
Promise.all(videos.map(v=>new Promise((resolve,reject)=>{if(v.readyState>=3)return resolve();v.addEventListener('canplay',resolve,{once:true});v.addEventListener('error',reject,{once:true});}))).then(()=>{toggle.disabled=false;restart.disabled=false;void play();}).catch(()=>{status.textContent='A video could not load. Refresh this page to retry.';});
</script>
</body>
</html>
